name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

# A new push to a pull request replaces its running checks; main and release
# branches finish every run so each commit there keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job blocks: a red job fails the run. All four are required checks on
# main in the "protect main" ruleset (a repository setting the owner changes),
# so renaming a job here also means renaming its required check there.
jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links

      # Release gate: every bold lead in under What's new must end in . ! ? or a comma, the
      # rule dontbemichael.com's /download list reads (website latest.js whatsNew). 0.2.4
      # shipped "**Company foundations:**" and the site dropped its headline.
      - name: Release lead ins show on the website
        run: npm run check:leadins

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # macOS ships first, and tests scoped to macOS or POSIX (test/platform.cjs)
  # run only here. Supersedes R6 in docs/designs/windows-11-installer.md.
  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Install scripts must run: they finish the Electron runtime and node-pty.
      - name: Install dependencies
        run: npm ci
      - name: Test suite
        run: npm run test:focused

  test-windows:
    name: Tests (Windows)
    # windows-2022: its Visual Studio 2022 is one node-gyp can find; the newer
    # image's Visual Studio 18 is not, so native modules fail to build.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # node-gyp (native node-pty rebuild in npm ci) needs distutils.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools
      # Install scripts must run: they finish the Electron runtime and node-pty.
      - name: Install dependencies
        run: npm ci
      - name: Test suite
        run: npm run test:focused
