name: Release

# Build the Mac installer and publish it to a GitHub Release whenever a v* tag
# is pushed. Run manually (workflow_dispatch) to dry-build without publishing.
# Mac, and Windows as a beta (owner, 2026-10-04; docs/designs/windows-11-installer.md).
# Windows builds on every tag but only its leg may fail; tools/release-assets.cjs
# publishes Windows files on rc tags, and on clean tags only once the repository
# variable WINDOWS_RELEASE is "on". Linux stays configured in electron-builder.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is a beta: its failure never blocks the Mac release (R1).
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          # windows-2022, as in ci.yml: node-gyp cannot find the newer image's Visual Studio 18.
          - os: windows-2022
            args: --win
          # - os: ubuntu-latest
          #   args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (used to rebuild native node-pty) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 and install setuptools so the distutils
      # shim is available across all runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Compile (electron-vite → out/)
        run: npm run build
        env:
          # Anonymous product analytics (TELEMETRY.md). The PostHog project key
          # is public/write-only, but only official release builds inject it —
          # forks without the secret compile with '' and analytics no-ops.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      # Sign from a keychain this job creates, not from CSC_LINK. electron-builder
      # 25 makes its own keychain from CSC_LINK, then calls set-key-partition-list
      # with the certificate's password instead of that keychain's, which macOS
      # 26.6 refuses ("SecKeychainUnlock: The user name or passphrase you entered
      # is not correct"), so every signed Mac build failed (owner, 2026-10-23).
      # With CSC_KEYCHAIN set and no CSC_LINK, electron-builder skips that step.
      - name: Import the Mac signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No Developer ID certificate: a dry build is sealed ad hoc; a tagged release stops in build/notarize.cjs."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package installers
        shell: bash
        # GH_TOKEN lets electron-builder skip its own publish; we upload via the
        # release step below for full control over the asset set.
        #
        # Without a Developer ID cert (APPLE_CERTIFICATE_P12 unset) a dry build's
        # Mac app is sealed ad hoc by build/notarize.cjs. A tag sets
        # REQUIRE_DEVELOPER_ID, so a release without the cert fails instead: every
        # release since v0.2.6 is signed and notarized, and RELEASE.md says so.
        #
        # The certificate comes from CSC_KEYCHAIN (the step above), never CSC_LINK:
        # electron-builder would read an empty CSC_LINK as a path to the repo
        # folder ("not a file", the first v0.0.1 run), and a set one hits the
        # keychain bug above.
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization — MUST be macOS-only, so gate on the OS. The Developer
          # ID certificate itself is imported by the step above:
          #   APPLE_CERTIFICATE_P12       = base64 of the "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD  = that .p12's export password
          # Required on a tag (REQUIRE_DEVELOPER_ID); a dry build without them is
          # sealed ad hoc instead (build/notarize.cjs).
          REQUIRE_DEVELOPER_ID: ${{ matrix.os == 'macos-latest' && github.ref_type == 'tag' && '1' || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # hash only the distributable artifacts, not blockmaps/yml
          files=$(ls *.dmg *.zip *.exe *.AppImage 2>/dev/null || true)
          [ -z "$files" ] && { echo "no artifacts to hash"; exit 0; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.os }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          # zip + latest*.yml + blockmaps feed electron-updater (auto-update):
          # latest-mac.yml points Squirrel.Mac at the zip; nsis/AppImage use
          # latest.yml/latest-linux.yml + blockmaps for differential download.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Choose assets, checksums and notes
        # Windows files only on rc tags, or once WINDOWS_RELEASE is "on"; a release
        # without Windows also drops its checksum lines and the notes' Windows section.
        env:
          TAG: ${{ github.ref_name }}
          WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
        run: |
          node tools/release-assets.cjs artifacts release RELEASE.md release-notes.md
          ls -la release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # RELEASE.md is the human-facing notes; GitHub shows it as the body.
          body_path: release-notes.md
          # A tag carrying a pre-release suffix (v0.4.4-rc.1, -beta.2 …) publishes
          # as a PRE-RELEASE. This is load-bearing, not cosmetic: the in-app
          # updater polls /releases/latest, and GitHub excludes pre-releases from
          # that endpoint. So an rc gets a real, public, shareable download page
          # WITHOUT offering itself to every installed copy of the app — which is
          # exactly what you want for a build that needs testing on a platform the
          # authors cannot run. A clean `vX.Y.Z` tag is unaffected and still ships
          # as the latest release to everyone.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt
